version: '3.8'
services:
  test-postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-app:
    build: ./server
    environment:
      DB_HOST: test-postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: password
      DB_NAME: testdb_test
      NODE_ENV: test
    depends_on:
      test-postgres:
        condition: service_healthy
    command: npm run test:integration
