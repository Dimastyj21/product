services:
  postgres-db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: testdb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:  # ← ДОБАВЬ ЭТО
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASS: 123
      DB_NAME: testdb
    depends_on:  # ← ИЗМЕНИ НА ЭТО
      postgres-db:
        condition: service_healthy
    volumes:
      - ./server:/app

volumes:
  pgdata:
