# .github/workflows/ci.yml

name: CI Pipeline

on:
  push:
    branches: [ main, orders ]       # Запускать при пуше в main и orders
  pull_request:
    branches: [ main, orders ]       # Запускать при открытии/обновлении PR в main или orders

jobs:
  build-and-test:
    runs-on: ubuntu-latest           # Установленная среда GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # Клонирование кода

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18           # Используемая версия node.js

      - name: Install dependencies
        run: |
          cd server                  # Переход в папку server с package.json
          npm ci                     # Быстрая и надёжная установка зависимостей

      - name: Build project
        run: |
          cd server
          npm run build              # Сборка проекта

      - name: Run unit tests
        run: |
          cd server
          npm test                   # Запуск юнит-тестов с отчетом

      # Если есть, можно добавить запуск линтера:
      # - name: Run lint
      #   run: |
      #     cd server
      #     npm run lint

      # Можно добавить запуск интеграционных или e2e тестов:
      # - name: Run e2e tests
      #   run: |
      #     cd server
      #     npm run test:e2e