# .github/workflows/ci.yml

name: CI Pipeline

on:
  push:
    branches: [ main, orders ]       # Запускать при пуше в main и orders
  pull_request:
    branches: [ main, orders ]       # Запускать при открытии/обновлении PR в main или orders

jobs:
  build-and-test:
    runs-on: ubuntu-latest           # Установленная среда GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # Клонирование кода

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18           # Используемая версия node.js

      - name: Install dependencies
        run: npm ci                  # Быстрая и надёжная установка зависимостей

      - name: Build project
        run: npm run build           # Собрать проект (если есть сборка)

      - name: Run unit tests
        run: npm test                # Запуск юнит-тестов с отчетом

      # Если есть, можно добавить запуск линтера:
      # - name: Run lint
      #   run: npm run lint

      # Можно добавить шаг с запуском интеграционных или e2e тестов, например:
      # - name: Run e2e tests
      #   run: npm run test:e2e